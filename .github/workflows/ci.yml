name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test skills
        run: ./scripts/test-skills.sh
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race -count=1 ./...
      - name: Build release matrix
        run: ./scripts/build-release.sh ci
      - uses: actions/upload-artifact@v4
        with:
          name: satchel-ci
          path: |
            dist/satchel_*
            dist/SHA256SUMS
          if-no-files-found: error
